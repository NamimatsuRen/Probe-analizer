[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "probe-analizer"
version = "0.7.1"
description = "Folder-first desktop browser and analyzer for probe measurement data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NamimatsuRen" }]
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.7",
  "pyqtgraph>=0.13.7",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-qt>=4.4",
  "ruff>=0.6",
]

[project.scripts]
probe-analizer = "probe_app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/probe_app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["probe_app"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyqtgraph", "pyqtgraph.*", "scipy", "scipy.*"]
ignore_missing_imports = true
