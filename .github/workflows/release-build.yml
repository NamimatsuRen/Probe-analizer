name: Release builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-arm64
          - os: windows-2025
            label: Windows-x64
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install application and build tool
        run: |
          uv sync --frozen --extra dev
          uv pip install --python .venv "pyinstaller>=6.14,<7"

      - name: Verify release source
        run: |
          uv run --no-sync pytest
          uv run --no-sync ruff check .
          uv run --no-sync mypy

      - name: Build desktop application
        run: uv run --no-sync pyinstaller --noconfirm --clean packaging/probe-analizer.spec

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Probe Analizer.app" "dist/Probe-Analizer-macOS-arm64.zip"
          rm -rf "dist/Probe Analizer.app" "dist/Probe-Analizer"

      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Probe-Analizer/*" -DestinationPath "dist/Probe-Analizer-Windows-x64.zip"
          Remove-Item -Recurse -Force "dist/Probe-Analizer"

      - name: Write SHA-256 checksums
        run: uv run --no-sync python scripts/write_checksums.py dist

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Probe-Analizer-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
